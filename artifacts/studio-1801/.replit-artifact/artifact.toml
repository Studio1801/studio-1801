kind = "web"
previewPath = "/"
title = "Studio 1801"
description = "A visual portfolio and contact website for Studio 1801, an independent design studio working across identity, digital experiences, and art direction."
version = "1.0.0"
id = "artifacts/studio-1801"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24302

[services.development]
run = "pnpm --filter @workspace/studio-1801 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/studio-1801", "run", "build" ]

[services.production.run]
args = [ "pnpm", "--filter", "@workspace/studio-1801", "run", "serve" ]

[services.production.run.env]
PORT = "24302"
BASE_PATH = "/"
NODE_ENV = "production"

[services.production.health.startup]
path = "/"

[services.env]
PORT = "24302"
BASE_PATH = "/"
